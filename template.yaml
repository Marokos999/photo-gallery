AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Photo Gallery - serverless photo upload, processing and albums

Parameters:
  AllowedOrigin:
    Type: String
    Default: http://localhost:3000
    AllowedPattern: "^https?://[^/]+$"
    Description: >-
      Origin the frontend is served from (scheme, host and optional port, no trailing slash),
      e.g. https://gallery.example.com. Used for API Gateway, Photos API and S3 CORS.

Globals:
  Function:
    Runtime: dotnet10
    Architectures: [arm64]
    MemorySize: 1024
    Timeout: 30
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        TABLE_NAME: !Ref PhotoTable
        BUCKET_NAME: !Sub "${AWS::StackName}-photos-${AWS::AccountId}"
        LOCALSTACK_ENDPOINT: ""
        S3_PUBLIC_ENDPOINT: ""
        POWERTOOLS_LOG_LEVEL: Information
        POWERTOOLS_METRICS_NAMESPACE: PhotoGallery
        POWERTOOLS_TRACE_DISABLED: "false"

Resources:
  PhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-photos-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref AllowedOrigin]
            AllowedMethods: [POST, GET]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000

  PhotoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-PhotoGallery"
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ExpiresAt
        Enabled: true
      StreamSpecification:
        StreamViewType: OLD_IMAGE
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  # Identity: users sign up with their email; the API trusts the `sub` claim of the ID/access token.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-web"
      # Public SPA client: no secret, SRP sign-in, short-lived tokens with refresh.
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Every route requires a valid Cognito JWT unless it opts out with `Authorizer: NONE`.
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref UserPoolClient]
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        # x-debug-user-id only matters locally (sam local + LocalStack); the functions ignore it in AWS.
        AllowHeaders: [authorization, content-type, x-debug-user-id]
        MaxAge: 600

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/PhotoGallery.Upload/
      Handler: PhotoGallery.Upload::PhotoGallery.Upload.UploadFunction::HandleAsync
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: photo-upload
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotoTable
        - S3WritePolicy:
            BucketName: !Sub "${AWS::StackName}-photos-${AWS::AccountId}"
      Events:
        GetUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/photos/upload-url
            Method: POST

  ProcessingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/PhotoGallery.Processing/
      Handler: PhotoGallery.Processing::PhotoGallery.Processing.ProcessingFunction::HandleAsync
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: photo-processing
      MemorySize: 2048
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotoTable
        - S3CrudPolicy:
            BucketName: !Sub "${AWS::StackName}-photos-${AWS::AccountId}"
      Events:
        OriginalUploaded:
          Type: S3
          Properties:
            Bucket: !Ref PhotoBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: originals/ }

  ExpiredUploadCleanupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/PhotoGallery.Processing/
      Handler: PhotoGallery.Processing::PhotoGallery.Processing.ExpiredUploadCleanupFunction::HandleAsync
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: expired-upload-cleanup
      MemorySize: 256
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub "${AWS::StackName}-photos-${AWS::AccountId}"
      Events:
        PendingUploadExpired:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt PhotoTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 25
            # Only TTL deletions reach the function (user deletes are cleaned up by the API).
            FilterCriteria:
              Filters:
                - Pattern: eventName:[REMOVE]

  PhotosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/PhotoGallery.Photos/
      Handler: PhotoGallery.Photos
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: photos-api
          Cors__AllowedOrigins__0: !Ref AllowedOrigin
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotoTable
        - S3CrudPolicy:
            BucketName: !Sub "${AWS::StackName}-photos-${AWS::AccountId}"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: ANY
        # Public routes: share links are opened by people without an account.
        SharedAlbum:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/shared/{code}
            Method: GET
            Auth:
              Authorizer: NONE
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/health
            Method: GET
            Auth:
              Authorizer: NONE

Outputs:
  ApiUrl:
    Description: Base URL for NEXT_PUBLIC_API_URL / NEXT_PUBLIC_UPLOAD_URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  BucketName:
    Value: !Ref PhotoBucket
  TableName:
    Value: !Ref PhotoTable
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
